<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Ansh Yadav">
  <title>Ansh Yadav</title>
  <!--
    The "A" is a path, not text: a favicon has no font stack to fall back on,
    and drawing it means the mark rasterises identically everywhere.

    Deliberately not theme-aware. An inverting tile would disagree with the
    .ico and apple-touch fallbacks, which cannot invert — and it is not needed:
    the ink tile sits on a dark tab strip as a white letter floating on near
    black, which is legible without a second palette to keep in sync.

    favicon.ico and apple-touch-icon.png are generated FROM this file. If the
    mark changes here, regenerate them — see scripts/build-icons.mjs.
  -->
  <rect width="100" height="100" rx="22" fill="#0b0b0c" />
  <path
    fill="#fbfbf9"
    fill-rule="evenodd"
    d="M50 23 L84 79 L67 79 L60 66 L40 66 L33 79 L16 79 Z
       M50 37 L58 56 L42 56 Z"
  />
</svg>
